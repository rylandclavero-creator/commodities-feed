name: Fetch TE commodity prices (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-te:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fetch Trading Economics quotes
      run: |
        python fetch_te.py
        mv data/prices.json data/prices_te.json
        git checkout -- data/prices.json
    - name: Commit TE prices
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/prices_te.json
        git diff --staged --quiet || (git commit -m "TE prices update" && git push)
